[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-search"
version = "0.1.0"
description = "Local-first media asset semantic search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pillow>=10.0.0",
  "numpy>=1.26.0",
  "pydantic>=2.0.0",
  "python-multipart>=0.0.9",
  "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]
gcp = [
  "google-auth>=2.29.0",
  "requests>=2.32.0",
  "google-cloud-storage>=2.16.0",
  "google-cloud-run>=0.10.0",
  "google-cloud-bigquery>=3.25.0",
]
semantic = [
  "open-clip-torch>=2.24.0",
  "torch>=2.2.0",
  "transformers>=4.40.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
