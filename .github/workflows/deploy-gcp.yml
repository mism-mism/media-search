name: deploy-gcp

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: GCP project id
        required: true
        type: string
      region:
        description: GCP region
        required: true
        default: asia-northeast1
        type: string
      image_tag:
        description: Image tag
        required: true
        default: latest
        type: string
      image_annotation_backend:
        description: "Image auto-tags (Gemini requires the documented Vertex AI IAM permission)"
        required: true
        default: gemini
        type: choice
        options:
          - gemini
          - off
      allow_unauthenticated:
        description: "true = public (non-prod only); false = IAP/prod (do not use public for production)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      REGION: ${{ inputs.region }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      IMAGE_ANNOTATION_BACKEND: ${{ inputs.image_annotation_backend }}
      ALLOW_UNAUTH: ${{ inputs.allow_unauthenticated }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push
        run: |
          set -euo pipefail
          REPO="${REGION}-docker.pkg.dev/${PROJECT_ID}/media-search-repo"
          IMAGE="${REPO}/media-search:${IMAGE_TAG}"
          docker build \
            --build-arg INSTALL_SEMANTIC=1 \
            --build-arg INSTALL_GCP=1 \
            --build-arg PREWARM_OPENCLIP=1 \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run
        run: |
          set -euo pipefail
          AUTH_FLAG=(--no-allow-unauthenticated)
          if [[ "$ALLOW_UNAUTH" == "true" ]]; then
            echo "WARNING: deploying with --allow-unauthenticated (non-prod only)" >&2
            AUTH_FLAG=(--allow-unauthenticated)
          else
            echo "Deploying with authentication required (use IAP + iap_members via Terraform)"
          fi
          gcloud run deploy media-search \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            "${AUTH_FLAG[@]}" \
            --cpu=2 \
            --memory=8Gi \
            --port=8080 \
            --min=0 \
            --min-instances=0 \
            --cpu-throttling \
            --update-env-vars="IMAGE_ANNOTATION_BACKEND=${IMAGE_ANNOTATION_BACKEND},IMAGE_ANNOTATION_MODEL=gemini-3.1-flash-lite,IMAGE_ANNOTATION_LOCATION=global,IMAGE_ANNOTATION_MAX_PER_IMPORT=50,EMBEDDER=local,MEDIA_BACKEND=gcs,GCS_PREFIX=incoming,MEDIA_SEARCH_DATA=/tmp/media-search,MEDIA_SEARCH_DB=/tmp/media-search/media-local-cos.db,MEDIA_SEARCH_WORK=/tmp/media-search/work,FRAME_BACKEND=gcs,GCS_FRAMES_PREFIX=frames,IMPORT_LOCK_BACKEND=gcs,IMPORT_JOB_BACKEND=cloudrun,CLOUD_RUN_IMPORT_JOB=media-search-import,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},CLOUD_RUN_REGION=${REGION},GCS_BUCKET=media-search-${PROJECT_ID}-media,MEDIA_SEARCH_DB_GCS=gs://media-search-${PROJECT_ID}-media/state/media-local-cos.db"
          SA=$(gcloud run services describe media-search \
            --project="$PROJECT_ID" --region="$REGION" \
            --format='value(spec.template.spec.serviceAccountName)')
          if gcloud run jobs describe media-search-import \
            --project="$PROJECT_ID" --region="$REGION" >/dev/null 2>&1; then
            JOB_CMD=update
          else
            JOB_CMD=create
          fi
          gcloud run jobs "$JOB_CMD" media-search-import \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --service-account="$SA" \
            --cpu=4 \
            --memory=16Gi \
            --task-timeout=3600 \
            --max-retries=0 \
            --command=python \
            --args=-m,media_search.worker_import \
            --set-env-vars="IMAGE_ANNOTATION_BACKEND=${IMAGE_ANNOTATION_BACKEND},IMAGE_ANNOTATION_MODEL=gemini-3.1-flash-lite,IMAGE_ANNOTATION_LOCATION=global,IMAGE_ANNOTATION_MAX_PER_IMPORT=50,IMPORT_MODE=worker,EMBEDDER=local,MEDIA_BACKEND=gcs,GCS_BUCKET=media-search-${PROJECT_ID}-media,GCS_PREFIX=incoming,FRAME_BACKEND=gcs,GCS_FRAMES_PREFIX=frames,IMPORT_LOCK_BACKEND=gcs,MEDIA_SEARCH_DATA=/tmp/media-search,MEDIA_SEARCH_DB=/tmp/media-search/media-local-cos.db,MEDIA_SEARCH_DB_GCS=gs://media-search-${PROJECT_ID}-media/state/media-local-cos.db,MEDIA_SEARCH_WORK=/tmp/media-search/work,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},CLOUD_RUN_REGION=${REGION},IMPORT_EMBED_WORKERS=4"
          # Best-effort IAP enable when not public (ignore if API/CLI shape differs)
          if [[ "$ALLOW_UNAUTH" != "true" ]]; then
            gcloud beta run services update media-search \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --iap=enabled \
              || echo "NOTE: enable IAP in Console / Terraform if this flag is unsupported" >&2
          fi
          gcloud run services describe media-search \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)'
