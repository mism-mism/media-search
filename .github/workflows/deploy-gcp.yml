name: deploy-gcp

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: GCP project id
        required: true
        type: string
      region:
        description: GCP region
        required: true
        default: asia-northeast1
        type: string
      image_tag:
        description: Image tag
        required: true
        default: latest
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      REGION: ${{ inputs.region }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push
        run: |
          set -euo pipefail
          REPO="${REGION}-docker.pkg.dev/${PROJECT_ID}/media-search-repo"
          IMAGE="${REPO}/media-search:${IMAGE_TAG}"
          docker build \
            --build-arg INSTALL_SEMANTIC=1 \
            --build-arg INSTALL_GCP=1 \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy media-search \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --allow-unauthenticated \
            --cpu=2 \
            --memory=4Gi \
            --port=8080 \
            --set-env-vars="EMBEDDER=local,MEDIA_BACKEND=gcs,GCS_PREFIX=incoming,MEDIA_SEARCH_DATA=/tmp/media-search,MEDIA_SEARCH_DB=/tmp/media-search/media-local-cos.db,MEDIA_SEARCH_WORK=/tmp/media-search/work" \
            --update-env-vars="GCS_BUCKET=media-search-${PROJECT_ID}-media,MEDIA_SEARCH_DB_GCS=gs://media-search-${PROJECT_ID}-media/state/media-local-cos.db"
          gcloud run services describe media-search \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)'
