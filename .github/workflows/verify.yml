name: verify

on:
  pull_request:
  merge_group:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve base/head and run pre-merge
        env:
          MAIN_BRANCH: main
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            export BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            export BASE_SHA="${{ github.event.merge_group.base_sha }}"
            export HEAD_SHA="${{ github.event.merge_group.head_sha }}"
          else
            # push: health check (post-hoc). before may be all-zero on first push.
            export BASE_SHA="${{ github.event.before }}"
          fi
          echo "BASE_SHA=$BASE_SHA"
          echo "HEAD_SHA=$HEAD_SHA"
          ./hooks/pre-merge/check
